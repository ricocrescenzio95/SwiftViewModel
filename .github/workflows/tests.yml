name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        run: swift test --parallel
